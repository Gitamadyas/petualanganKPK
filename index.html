<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Petualangan Kelipatan: Misi Menemukan KPK</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%);
      min-height: 100vh;
      color: #f8fafc;
    }
    .font-pop { font-family: 'Fredoka One', cursive; }
    .glass-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .btn-option {
      transition: all 0.2s ease;
    }
    .btn-option:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
    .tree-node {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #fbbf24;
      color: #1e1b4b;
      font-weight: bold;
      font-size: 1.2rem;
    }
  </style>
</head>
<body class="p-4 md:p-8 flex justify-center items-center">

  <div id="app" class="w-full max-w-3xl glass-card rounded-3xl p-6 md:p-10 shadow-2xl relative overflow-hidden">
    
    <!-- HEADER SKOR & PROGRESS -->
    <div id="header-stats" class="hidden flex justify-between items-center border-b border-white/20 pb-4 mb-6">
      <div>
        <span class="text-xs uppercase tracking-wider text-indigo-200">Siswa</span>
        <h3 id="player-display" class="font-pop text-lg text-amber-300">Siswa</h3>
      </div>
      <div class="text-right">
        <span class="text-xs uppercase tracking-wider text-indigo-200">Total Skor</span>
        <div id="score-display" class="font-pop text-2xl text-emerald-400">0</div>
      </div>
    </div>

    <!-- SCREEN 1: LOGIN -->
    <div id="screen-login" class="text-center space-y-6">
      <div class="inline-block p-4 bg-amber-400 text-indigo-950 rounded-full font-pop text-4xl shadow-lg mb-2">
        🚀
      </div>
      <h1 class="font-pop text-3xl md:text-5xl text-amber-300 tracking-wide drop-shadow-md">
        Petualangan Kelipatan
      </h1>
      <p class="text-indigo-100 text-sm md:text-base max-w-md mx-auto">
        Misi Rahasia Menemukan KPK dengan Pohon Faktor dan Kelipatan Persekutuan! (10 Soal per Misi)
      </p>

      <div class="space-y-4 max-w-sm mx-auto pt-4">
        <input id="input-nama" type="text" placeholder="Masukkan Nama Lengkapmu..." 
          class="w-full px-5 py-3 rounded-2xl bg-white/20 border border-white/30 text-white placeholder-indigo-200 focus:outline-none focus:ring-2 focus:ring-amber-400 text-center font-bold text-lg" />
        <button onclick="startGame()" 
          class="w-full py-4 bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-300 hover:to-orange-400 text-indigo-950 font-pop text-xl rounded-2xl shadow-xl transition transform active:scale-95">
          Mulai Petualangan! 🎮
        </button>
      </div>
    </div>

    <!-- SCREEN 2: GAMEPLAY -->
    <div id="screen-game" class="hidden space-y-6">
      <div class="flex justify-between items-center text-sm font-semibold text-indigo-200">
        <span id="mission-title" class="bg-indigo-900/60 px-3 py-1 rounded-full border border-indigo-400/30">Misi 1</span>
        <span id="question-tracker">Soal 1 / 10</span>
      </div>

      <!-- AREA SOAL -->
      <div class="bg-indigo-950/50 p-6 rounded-2xl border border-white/10 space-y-4">
        <div id="question-text" class="text-lg md:text-xl font-bold text-white text-center leading-relaxed">
          <!-- Soal dimasukkan via JS -->
        </div>
        
        <!-- POHON FAKTOR CONTAINER (Jika Misi 3) -->
        <div id="tree-container" class="hidden flex-col items-center justify-center p-4 bg-white/5 rounded-xl space-y-2">
          <!-- Render Visual Pohon Faktor -->
        </div>
      </div>

      <!-- OPTIONS -->
      <div id="options-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Pilihan jawaban dirender JS -->
      </div>

      <!-- FEEDBACK BOX (Tampil SETELAH menjawab) -->
      <div id="feedback-box" class="hidden p-4 rounded-2xl text-center space-y-3">
        <div id="feedback-title" class="font-pop text-xl"></div>
        <p id="feedback-explain" class="text-sm text-indigo-100"></p>
        <button id="btn-next" onclick="nextQuestion()" 
          class="px-6 py-2 bg-amber-400 text-indigo-950 font-pop rounded-xl hover:bg-amber-300 transition">
          Lanjut Soal Berikutnya ➔
        </button>
      </div>
    </div>

    <!-- SCREEN 3: RESULT -->
    <div id="screen-result" class="hidden text-center space-y-6">
      <div class="text-5xl">🏆</div>
      <h2 class="font-pop text-3xl text-amber-300">Misi Selesai!</h2>
      <p id="result-nama" class="text-xl font-bold text-white"></p>
      
      <div class="grid grid-cols-2 gap-4 max-w-sm mx-auto bg-white/10 p-4 rounded-2xl border border-white/20">
        <div>
          <span class="text-xs text-indigo-200 block">Total Skor</span>
          <span id="final-score" class="font-pop text-3xl text-emerald-400">0</span>
        </div>
        <div>
          <span class="text-xs text-indigo-200 block">Akurasi Jawaban</span>
          <span id="final-accuracy" class="font-pop text-3xl text-amber-300">0%</span>
        </div>
      </div>

      <div id="send-status" class="text-sm text-indigo-200 animate-pulse">
        Mengirim hasil ke guru...
      </div>

      <button onclick="resetGame()" 
        class="px-8 py-3 bg-gradient-to-r from-emerald-400 to-teal-500 text-indigo-950 font-pop text-lg rounded-2xl shadow-lg hover:from-emerald-300 hover:to-teal-400 transition">
        🔄 Main Lagi (Soal Baru)
      </button>
    </div>

  </div>

  <script>
    const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbzVgiP9hOOjgXjFe4DJVMcg9plcv9yxREGRJJhe4smomIt8px5Po_a541eFPZxtIonX/exec";

    let state = {
      nama: "",
      totalSkor: 0,
      jawabanBenar: 0,
      jawabanSalah: 0,
      skorM1: 0,
      skorM2: 0,
      skorM3: 0,
      misiAktif: 1,
      indeksSoal: 0,
      daftarSoal: []
    };

    const gcd = (a, b) => b === 0 ? a : gcd(b, a % b);
    const lcm = (a, b) => (a * b) / gcd(a, b);
    const randomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function startGame() {
      const inputNama = document.getElementById("input-nama").value.trim();
      if (!inputNama) return alert("Masukkan namamu dulu ya!");
      
      state.nama = inputNama;
      state.totalSkor = 0;
      state.jawabanBenar = 0;
      state.jawabanSalah = 0;
      state.skorM1 = 0;
      state.skorM2 = 0;
      state.skorM3 = 0;
      state.misiAktif = 1;

      document.getElementById("player-display").innerText = state.nama;
      document.getElementById("score-display").innerText = "0";
      
      document.getElementById("screen-login").classList.add("hidden");
      document.getElementById("header-stats").classList.remove("hidden");
      document.getElementById("screen-game").classList.remove("hidden");

      generateMissionQuestions();
    }

    function generateMissionQuestions() {
      state.indeksSoal = 0;
      state.daftarSoal = [];

      if (state.misiAktif === 1) {
        document.getElementById("mission-title").innerText = "Misi 1: Konsep Kelipatan Bilangan";
        for (let i = 0; i < 10; i++) {
          const base = randomInt(2, 12);
          const type = randomInt(1, 2);
          if (type === 1) {
            const mult = base * randomInt(2, 9);
            const wrong1 = mult + randomInt(1, 2);
            const wrong2 = mult - randomInt(1, 2);
            const wrong3 = mult + randomInt(3, 4);
            state.daftarSoal.push({
              teks: `Manakah angka di bawah ini yang merupakan kelipatan dari **${base}**?`,
              pilihan: shuffle(Array.from(new Set([mult, wrong1, wrong2, wrong3])).slice(0, 4)),
              kunci: mult,
              penjelasan: "Kelipatan adalah hasil perkalian suatu bilangan dengan bilangan bulat."
            });
          } else {
            const k1 = base * 1, k2 = base * 2, k3 = base * 3, k4 = base * 4;
            state.daftarSoal.push({
              teks: `Lengkapi barisan kelipatan berikut: **${k1}, ${k2}, ___, ${k4}**`,
              pilihan: shuffle(Array.from(new Set([k3, k3 + 1, k3 - 1, k3 + 2])).slice(0, 4)),
              kunci: k3,
              penjelasan: "Pola barisan kelipatan ini selalu melompat dengan penambahan angka yang sama."
            });
          }
        }
      } else if (state.misiAktif === 2) {
        document.getElementById("mission-title").innerText = "Misi 2: Kelipatan Persekutuan";
        for (let i = 0; i < 10; i++) {
          const a = randomInt(2, 7);
          let b = randomInt(3, 9);
          if (a === b) b++;
          
          const ansKpk = lcm(a, b);
          const wrong1 = ansKpk + Math.min(a, b);
          const wrong2 = Math.abs(ansKpk - Math.min(a, b)) || ansKpk + 1;
          const wrong3 = a * b + 2;

          state.daftarSoal.push({
            teks: `Berapakah kelipatan persekutuan terkecil (pertama) dari **${a}** dan **${b}**?`,
            pilihan: shuffle(Array.from(new Set([ansKpk, wrong1, wrong2, wrong3])).slice(0, 4)),
            kunci: ansKpk,
            penjelasan: "Kelipatan persekutuan adalah kelipatan yang sama dari dua bilangan atau lebih."
          });
        }
      } else if (state.misiAktif === 3) {
        document.getElementById("mission-title").innerText = "Misi 3: Pohon Faktor & KPK";
        const pairs = [
          [4, 6], [6, 8], [8, 12], [10, 15], [12, 18], 
          [9, 12], [15, 20], [6, 15], [8, 20], [12, 16],
          [14, 21], [18, 24]
        ];
        const shuffledPairs = shuffle([...pairs]);
        
        for (let i = 0; i < 10; i++) {
          const selected = shuffledPairs[i % shuffledPairs.length];
          const n1 = selected[0], n2 = selected[1];
          const ansKpk = lcm(n1, n2);
          const wrong1 = ansKpk + 4;
          const wrong2 = Math.max(2, ansKpk / 2);
          const wrong3 = ansKpk + 8;

          state.daftarSoal.push({
            teks: `Gunakan analisis Pohon Faktor untuk menentukan KPK dari **${n1}** dan **${n2}**!`,
            treeData: { n1, n2 },
            pilihan: shuffle(Array.from(new Set([ansKpk, wrong1, wrong2, wrong3])).slice(0, 4)),
            kunci: ansKpk,
            penjelasan: "Pohon faktor membantu memfaktorkan bilangan menjadi perkalian faktor-faktor prima."
          });
        }
      }

      renderQuestion();
    }

    function renderQuestion() {
      const q = state.daftarSoal[state.indeksSoal];
      document.getElementById("question-tracker").innerText = `Soal ${state.indeksSoal + 1} / 10`;
      document.getElementById("question-text").innerHTML = q.teks.replace(/\*\*(.*?)\*\*/g, '<span class="text-amber-300 font-bold">$1</span>');
      
      const treeContainer = document.getElementById("tree-container");
      if (q.treeData) {
        treeContainer.classList.remove("hidden");
        treeContainer.innerHTML = `
          <div class="flex justify-around w-full max-w-md my-2">
            <div class="text-center">
              <div class="tree-node">${q.treeData.n1}</div>
              <div class="text-xs text-indigo-300 mt-1">🌿 Pohon A</div>
            </div>
            <div class="text-center">
              <div class="tree-node">${q.treeData.n2}</div>
              <div class="text-xs text-indigo-300 mt-1">🌿 Pohon B</div>
            </div>
          </div>
        `;
      } else {
        treeContainer.classList.add("hidden");
      }

      const optContainer = document.getElementById("options-container");
      optContainer.innerHTML = "";
      document.getElementById("feedback-box").classList.add("hidden");

      q.pilihan.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "btn-option p-4 bg-white/10 hover:bg-white/20 border border-white/20 rounded-2xl font-bold text-xl text-white text-center";
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(opt, btn);
        optContainer.appendChild(btn);
      });
    }

    function checkAnswer(selected, btn) {
      const q = state.daftarSoal[state.indeksSoal];
      const isCorrect = selected === q.kunci;

      const allBtns = document.querySelectorAll(".btn-option");
      allBtns.forEach(b => b.disabled = true);

      const feedbackBox = document.getElementById("feedback-box");
      const feedbackTitle = document.getElementById("feedback-title");
      const feedbackExplain = document.getElementById("feedback-explain");

      feedbackBox.classList.remove("hidden");

      if (isCorrect) {
        btn.classList.add("bg-emerald-500/80", "border-emerald-300");
        feedbackBox.className = "p-4 rounded-2xl text-center space-y-3 bg-emerald-950/80 border border-emerald-500/50";
        feedbackTitle.className = "font-pop text-xl text-emerald-300";
        feedbackTitle.innerText = "🎉 JAWABAN BENAR! (+10 Poin)";
        
        state.totalSkor += 10;
        state.jawabanBenar++;
        if (state.misiAktif === 1) state.skorM1 += 10;
        if (state.misiAktif === 2) state.skorM2 += 10;
        if (state.misiAktif === 3) state.skorM3 += 10;

      } else {
        btn.classList.add("bg-rose-500/80", "border-rose-300");
        feedbackBox.className = "p-4 rounded-2xl text-center space-y-3 bg-rose-950/80 border border-rose-500/50";
        feedbackTitle.className = "font-pop text-xl text-rose-300";
        // Kunci jawaban disembunyikan total dari peserta
        feedbackTitle.innerText = "❌ JAWABAN KURANG TEPAT!";
        state.jawabanSalah++;
      }

      document.getElementById("score-display").innerText = state.totalSkor;
      feedbackExplain.innerHTML = q.penjelasan;
    }

    function nextQuestion() {
      state.indeksSoal++;
      if (state.indeksSoal < 10) {
        renderQuestion();
      } else {
        if (state.misiAktif < 3) {
          state.misiAktif++;
          generateMissionQuestions();
        } else {
          finishGame();
        }
      }
    }

    function finishGame() {
      document.getElementById("screen-game").classList.add("hidden");
      document.getElementById("screen-result").classList.remove("hidden");
      
      document.getElementById("result-nama").innerText = state.nama;
      document.getElementById("final-score").innerText = state.totalSkor;
      const acc = Math.round((state.jawabanBenar / 30) * 100);
      document.getElementById("final-accuracy").innerText = `${acc}%`;

      sendResultToAppsScript();
    }

    function sendResultToAppsScript() {
      const statusText = document.getElementById("send-status");
      statusText.innerText = "Mengirim hasil rekap ke guru...";

      const payload = {
        tanggal: new Date().toLocaleString("id-ID"),
        namaSiswa: state.nama,
        totalSkor: state.totalSkor,
        jawabanBenar: state.jawabanBenar,
        jawabanSalah: state.jawabanSalah,
        skorMisi1: state.skorM1,
        skorMisi2: state.skorM2,
        skorMisi3: state.skorM3,
        status: "Selesai"
      };

      fetch(WEBHOOK_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusText.innerText = "✅ Rekap nilai berhasil terkirim ke Google Sheets & Email Guru!";
        statusText.classList.remove("animate-pulse");
        statusText.classList.add("text-emerald-300");
      })
      .catch(err => {
        statusText.innerText = "⚠️ Terjadi masalah saat mengirim data, namun skor tetap tercatat lokal.";
      });
    }

    function resetGame() {
      document.getElementById("screen-result").classList.add("hidden");
      document.getElementById("screen-login").classList.remove("hidden");
      document.getElementById("header-stats").classList.add("hidden");
      document.getElementById("input-nama").value = "";
    }
  </script>
</body>
</html>
